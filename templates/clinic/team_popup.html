{% load static %}

<div id="team-modal" class="team-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="team-modal-title">
    <div class="team-modal-backdrop" data-team-close></div>
    <section class="team-modal-panel" role="document">
        <button type="button" class="team-modal-close" aria-label="Close team popup" data-team-close>
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>

        <header class="team-modal-header">
            <h2 id="team-modal-title">ทีมผู้จัดทำ SPU Medbay.</h2>
            <p>ICT12267 | ICT12367</p>
        </header>

        <div class="team-grid">
            <article class="team-card">
                <div class="team-photo theme-1 has-image">
                    <img src="{% static 'images/team/1.webp' %}" alt="68016626" onerror="this.style.display='none'; this.parentElement.classList.remove('has-image');">
                </div>
                <h3>เจตนิพัทธ์ อุตมกูล</h3>
                <p>68016626.</p>
            </article>
            <article class="team-card">
                <div class="team-photo theme-2 has-image">
                    <img src="{% static 'images/team/2.webp' %}" alt="68021656" onerror="this.style.display='none'; this.parentElement.classList.remove('has-image');">
                </div>
                <h3>กฤตพรรธ จิตตรีงาม</h3>
                <p>68021656.</p>
            </article>
            <article class="team-card">
                <div class="team-photo theme-3 has-image">
                    <img src="{% static 'images/team/3.webp' %}" alt="68048166" onerror="this.style.display='none'; this.parentElement.classList.remove('has-image');">
                </div>
                <h3>กันตพัชร ไหมเหลือง</h3>
                <p>68048166.</p>
            </article>
            <article class="team-card">
                <div class="team-photo theme-4 has-image">
                    <img src="{% static 'images/team/4.webp' %}" alt="68049469" onerror="this.style.display='none'; this.parentElement.classList.remove('has-image');">
                </div>
                <h3>ชคดี โพธิสัมฤทธิ์</h3>
                <p>68049469.</p>
            </article>
            <article class="team-card">
                <div class="team-photo theme-5 has-image">
                    <img src="{% static 'images/team/5.webp' %}" alt="68091301" onerror="this.style.display='none'; this.parentElement.classList.remove('has-image');">
                </div>
                <h3>อนุวัตร พิสุทธิ์ไพศาล</h3>
                <p>68091301.</p>
            </article>
        </div>

        <footer class="team-modal-tagline">Cooking with 💜 by SPU:SIT_ICT Students</footer>
    </section>
</div>

<script>
(function () {
    const trigger = document.getElementById('team-popup-trigger');
    const modal = document.getElementById('team-modal');
    if (!trigger || !modal) {
        return;
    }

    const closeTargets = modal.querySelectorAll('[data-team-close]');

    function openModal() {
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('team-modal-open');
    }

    function closeModal() {
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('team-modal-open');
    }

    trigger.addEventListener('click', openModal);

    closeTargets.forEach(function (item) {
        item.addEventListener('click', closeModal);
    });

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && modal.classList.contains('is-open')) {
            closeModal();
        }
    });
})();
</script>
